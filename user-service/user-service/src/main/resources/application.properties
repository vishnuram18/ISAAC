# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_user
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:180618}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8081

# Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.application.name=user-service

# JWT (override JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:SmartShopJwtSecretKeyLocalDev2024XYZ}
jwt.expiration=86400000

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics