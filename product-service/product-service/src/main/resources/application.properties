# Server configuration
server.port=8082

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_product
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:180618}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Configuration
spring.application.name=product-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT (override JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:SmartShopJwtSecretKeyLocalDev2024XYZ}
jwt.expiration=86400000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# Kafka Consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.listener.observation-enabled=true

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics