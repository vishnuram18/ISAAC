apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: smartshop/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            # Server-side requests (SSR) go through the internal K8s service
            - name: GATEWAY_INTERNAL_URL
              value: http://api-gateway:8080/api
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smartshop
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
