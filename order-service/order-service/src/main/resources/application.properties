spring.application.name=order-service

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_order
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:180618}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8083
spring.cloud.compatibility-verifier.enabled=false

# Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT (override JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:SmartShopJwtSecretKeyLocalDev2024XYZ}
jwt.expiration=86400000

# Feign: enable Resilience4j circuit breaker for all Feign clients
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j: default circuit breaker config (applies to all instances)
# Open circuit after 50% failures in a 5-call sliding window
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
# Stay open for 10s, then go half-open to test recovery
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Kafka Producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.template.observation-enabled=true

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics