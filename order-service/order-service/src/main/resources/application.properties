spring.application.name=order-service

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_order
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:180618}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8083
spring.cloud.compatibility-verifier.enabled=false

# Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT (override JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:SmartShopJwtSecretKeyLocalDev2024XYZ}
jwt.expiration=86400000