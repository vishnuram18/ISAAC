services:

  # ──────────────────────────────────────────
  # DATABASE
  # Single MySQL container with 3 databases.
  # docker/init.sql creates them automatically on first start.
  # ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "180618"
    ports:
      - "3307:3306"          # expose so you can connect with TablePlus / DBeaver (3307 avoids conflict with local MySQL on 3306)
    volumes:
      - mysql_data:/var/lib/mysql                              # data survives restarts
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql # runs once on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p180618", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # DISTRIBUTED TRACING
  # Visit http://localhost:9411 to see traces.
  # ──────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: smartshop-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────
  # MESSAGE BROKER
  # Kafka (KRaft mode — no Zookeeper needed).
  # order-service → order-placed  → product-service (reduce stock)
  # order-service → stock-restore → product-service (restore stock)
  # PLAINTEXT://kafka:9092  — internal container-to-container
  # EXTERNAL://localhost:9094 — host access for local dev
  # ──────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: smartshop-kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────
  # CACHE
  # Redis used by product-service for caching.
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartshop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # SERVICE REGISTRY
  # All Spring Boot services register here.
  # The API Gateway uses it to find them.
  # ──────────────────────────────────────────
  eureka-server:
    build: ./eureka-server/eureka-server
    container_name: smartshop-eureka
    ports:
      - "8761:8761"          # visit http://localhost:8761 to see the dashboard
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8761 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # USER SERVICE  (port 8081)
  # ──────────────────────────────────────────
  user-service:
    build: ./user-service/user-service
    container_name: smartshop-user
    ports:
      - "8081:8081"
    environment:
      # Override application.properties to use Docker service names instead of localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartshop_user
      DB_USER: root
      DB_PASSWORD: "180618"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8081/api/users/register > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # PRODUCT SERVICE  (port 8082)
  # ──────────────────────────────────────────
  product-service:
    build: ./product-service/product-service
    container_name: smartshop-product
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartshop_product
      DB_USER: root
      DB_PASSWORD: "180618"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/api/products/all"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # ORDER SERVICE  (port 8083)
  # ──────────────────────────────────────────
  order-service:
    build: ./order-service/order-service
    container_name: smartshop-order
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartshop_order
      DB_USER: root
      DB_PASSWORD: "180618"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8083 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # API GATEWAY  (port 8080)
  # Single entry point for the frontend.
  # Routes /api/users/** → user-service, etc.
  # ──────────────────────────────────────────
  api-gateway:
    build: ./api-gateway/api-gateway
    container_name: smartshop-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # FRONTEND  (port 3000)
  # Next.js app. The browser talks to the API
  # Gateway on localhost:8080 (not inside Docker).
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./FRONT/smartshop-ui
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080/api
    container_name: smartshop-frontend
    ports:
      - "3000:3000"
    environment:
      GATEWAY_INTERNAL_URL: http://api-gateway:8080/api
    depends_on:
      api-gateway:
        condition: service_healthy

# ──────────────────────────────────────────
# VOLUMES
# mysql_data persists your database between
# docker-compose down / up cycles.
# Use "docker-compose down -v" to wipe it.
# ──────────────────────────────────────────
volumes:
  mysql_data:
